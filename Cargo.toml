[package]
name = "osrs-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Read-only advisory MCP server for Old School RuneScape Hardcore worlds"
repository = "https://github.com/whcas/OSRS-MCP"
publish = false

[dependencies]
# HTTP client for the Hardcore prices API. Default features are disabled: only
# the rustls TLS backend is needed, and bodies are parsed by this crate.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Official Rust MCP SDK. Default features are disabled so that only the server
# side, the tool macros and the stdio transport are compiled; see ADR-0001.
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
# `raw_value` only adds the `RawValue` type: the market client reads average
# prices from their exact text, and the RuneLite parser reads `stats` in file
# order so that repeated skill names stay visible. It changes no existing
# behaviour, unlike `arbitrary_precision`, which is global.
serde_json = { version = "1", features = ["raw_value"] }
# Derive for typed error enums (maintainer decision, #41). Compile-time only; the
# locked version is already pulled in by rmcp.
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
# Client side of the SDK, used only to drive the server from tests.
rmcp = { version = "3.11", default-features = false, features = ["client", "server", "macros"] }
# Throwaway directories for the Git hook tests; no optional features needed.
tempfile = { version = "3", default-features = false }
# `net` is for the loopback HTTP server in the market client's unit tests.
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }

# Lint baseline: see "Lints" in README.md. CI runs Clippy with `-D warnings`,
# so every `warn` below fails the build. Group levels use priority -1 so the
# individual settings after them take precedence.

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Selected restriction lints. The restriction group as a whole is not enabled:
# many of its lints contradict each other or idiomatic Rust.
# No panics in production paths (allowed in tests via clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
exit = "warn"
# Keep stdout reserved for program output and, later, MCP protocol traffic:
# all output must go through explicit writers.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# Suppressions must say why, and use `#[expect]` so stale ones are reported.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Other inexpensive safeguards.
mem_forget = "warn"
rc_mutex = "warn"
str_to_string = "warn"
undocumented_unsafe_blocks = "warn"
